# Publishes only the Buffer Map prototype (prototypes/buffer-map) to GitHub Pages.
# The page asks for a Google Maps key in the browser; no key is stored in the repo.
name: Deploy prototype to Pages

on:
  push:
    branches: [overlay-info]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/buffer-map
      - id: deployment
        uses: actions/deploy-pages@v4
