<!doctype html>
<!--
  PROTOTYPE: throwaway. Lives on branch prototype/buffer-map, never on main.

  Question: what should designating a Buffer Map's centre look and feel like?
  Answer so far: a flexible buffer with band edges plus school search (formerly variant D; variants A–C were dropped).

    Place via the drop-pin button at top right (drag it onto the map, or tap it to toggle pin mode; "?" explains)
    or centre on a school from the centred sticky search header. The buffer takes the colour of the band its radius
    has reached; last edge = max radius (10 km cap).
    An always-visible pill under the search shows the count inside, per band; tap it for a scrollable list of
    those schools, grouped by band, each linking to its overlay. Search results carry the same band dots.
    Right-hand column, below the pin, of menus that minimise to Lucide icons: Band edges (radius, bands),
    Landmarks (toggles each Google landmark category). On narrow screens one opens at a time per column.
    Hover a school for name + student count; click it (outside pin mode) for a Zillow-style
    overlay: photo collage, student-count headline, fact chips, lorem "What's special".
    School markers are Lucide size icons (house / house-plus / building / building-complex)
    in band-coloured badges. The School size legend sits bottom-right above State: open at first, greyed after any activity.

  Features are SYNTHETIC (random points around Quezon City). The real Dataset isn't geocoded yet.
  Distance is straight-line (haversine), per CONTEXT.md.

  Run:  python -m http.server 8000 -d prototypes/buffer-map
  Open: http://localhost:8000/?key=YOUR_GOOGLE_MAPS_KEY
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffer Map Prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: #1d2329; background: #fff; }
  #app { height: 100%; }
  #map { height: 100%; }

  .float { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); padding: 10px 12px; }
  .hint { color: #666; font-size: 12px; }
  ul.list { list-style: none; padding: 0; margin: 8px 0; }
  ul.list li { padding: 6px 4px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:hover { background: #f3f6fa; }
  ul.list li.sel { background: #e3edff; font-weight: 600; }
  .band { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  /* Dock: a menu that minimises to a round Lucide icon button */
  .dock:not(.open) > .dockPanel, .dock.open > .dockIcon { display: none; }
  .dockIcon { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: #1d2329; box-shadow: 0 2px 8px rgba(0,0,0,.25);
              display: grid; place-items: center; cursor: pointer; padding: 0; }
  .dockPanel { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); padding: 8px 12px 12px; width: min(300px, calc(100vw - 28px)); }
  .dockHead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dockHead b { flex: 1; }
  .dockMin { width: 32px; height: 32px; margin-right: -6px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .dockMin:hover { background: rgba(127,127,127,.15); }
  .dock input[type=number] { font-size: 16px; }
  .dock label.check { display: flex; align-items: center; gap: 6px; padding: 3px 0; }

  /* Bottom-right column: School size legend above State */
  #cornerCol { position: fixed; right: 10px; bottom: 30px; z-index: 9; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* Compact School size legend: 2×2 grid, sized to its content */
  #legendDock .dockPanel { width: auto; padding: 4px 10px 8px; font-size: 12px; }
  #legendDock .dockHead { margin-bottom: 2px; }
  .legendGrid { display: grid; grid-template-columns: auto auto; gap: 4px 12px; }
  .legendGrid > span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .legendGrid .hint { font-size: 11px; }
  /* Greyed out after the first activity; full colour again while hovered or focused */
  .dock.faded > * { opacity: .45; filter: grayscale(1); transition: opacity .3s, filter .3s; }
  .dock.faded:hover > *, .dock.faded:focus-within > * { opacity: 1; filter: none; }
  #stateDock .dockPanel { background: #111; color: #9fe; opacity: .9; width: min(320px, calc(100vw - 20px)); max-height: 40vh; overflow: auto; }
  #state { margin: 0; font: 11px/1.35 ui-monospace, monospace; white-space: pre; }

  /* Layout: sticky search header, right-hand dock column, floating pin button */
  /* Centred; the side margins keep it clear of the pin button and dock column on the right */
  #searchBar { top: 10px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 136px)); padding: 0; background: none; box-shadow: none; z-index: 6; }
  .searchField { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 12px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25); color: #5f6368; }
  .searchField input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: #1d2329; }
  #qClear { width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; padding: 0; }
  #results { margin: 6px 0 0; padding: 4px 0; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-height: min(50vh, 360px); overflow: auto; }
  #results li { padding: 10px 14px; }
  #dockCol { top: 66px; right: 6px; padding: 4px; background: none; box-shadow: none; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
             max-height: calc(100% - 150px); overflow-y: auto; }

  /* Always-visible count of Features inside the buffer, under the search bar; tap to open Band edges */
  #countsPill { top: 64px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 136px); z-index: 4; padding: 4px 12px; border-radius: 999px;
                background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 13px; cursor: pointer;
                display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
  #countsPill .bandCount { display: inline-flex; align-items: center; gap: 4px; }
  #countsPill .chev { display: inline-flex; color: #5f6368; transition: transform .15s; }
  #countsPill[aria-expanded=true] .chev { transform: rotate(180deg); }
  @media (max-width: 640px) { #countsPill .wide { display: none; } }
  /* Band indicator: same colour as the buffer band (and map badge) the school falls in; grey = outside, black = centre */
  .dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; }
  #results .name, #insideList .name { display: flex; align-items: center; gap: 8px; min-width: 0; }

  /* Scrollable list of the schools inside the buffer, opened from the counts pill */
  #insideList { top: 96px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100vw - 32px)); max-height: min(55vh, 440px); overflow: auto; padding: 0 0 6px; z-index: 6; }
  /* Title centred between an empty column and the close button, both 32px, so it sits at the true centre */
  #insideList .insideHead { position: sticky; top: 0; z-index: 1; background: #fff; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center;
                            padding: 8px 8px; border-bottom: 1px solid #eee; }
  #insideList .insideHead b { grid-column: 2; text-align: center; }
  #insideList .bandHead { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px 2px; font-weight: 600; }
  #insideList ul.list { margin: 0; }
  #insideList li { padding: 8px 14px; cursor: default; }
  #insideList a { color: #0041d9; text-decoration: none; font-weight: 600; }
  #insideList a:hover { text-decoration: underline; }

  #pinDock { top: 9px; right: 8px; padding: 0; background: none; box-shadow: none; z-index: 7; }
  #pinFab { width: 48px; height: 48px; border-radius: 50%; border: 0; background: #fff; color: #1a73e8; box-shadow: 0 3px 10px rgba(0,0,0,.3);
            display: grid; place-items: center; padding: 0; cursor: grab; touch-action: none; user-select: none; }
  #pinDock.on #pinFab { background: #1a73e8; color: #fff; animation: pinPulse 1.6s infinite; }
  @keyframes pinPulse { from { box-shadow: 0 0 0 0 rgba(26,115,232,.55), 0 3px 10px rgba(0,0,0,.3); } to { box-shadow: 0 0 0 16px rgba(26,115,232,0), 0 3px 10px rgba(0,0,0,.3); } }
  #pinHelp { position: absolute; top: -6px; left: -6px; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #fff; color: #5f6368;
             box-shadow: 0 1px 4px rgba(0,0,0,.3); display: grid; place-items: center; padding: 0; cursor: pointer; }
  .pinChip { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); white-space: nowrap; pointer-events: none; display: none;
             background: #1d2329; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  #pinDock.on .pinChip { display: block; }
  #pinPop { position: absolute; right: 0; top: 58px; width: min(290px, calc(100vw - 32px)); background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.3); padding: 10px 14px 12px; }
  #pinPop ul { margin: 0; padding-left: 18px; }
  #pinPop li { margin: 4px 0; }
  #schoolTip { position: fixed; z-index: 15; pointer-events: none; background: #fff; border-radius: 6px; padding: 6px 10px;
               box-shadow: 0 2px 10px rgba(0,0,0,.3); transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; display: none; }

  /* Zillow-style school overlay */
  #schoolOverlay { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px; }
  #schoolOverlay [hidden] { display: none !important; }
  #schoolOverlay .sheet { background: #fff; width: min(980px, 100%); max-height: 100%; overflow: auto; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.4); }
  #schoolOverlay .topbar { position: sticky; top: 0; z-index: 1; background: #fff; display: flex; justify-content: space-between; align-items: center;
                           padding: 10px 16px; border-bottom: 1px solid #e6e6e6; }
  #schoolOverlay .brand { font-weight: 800; font-size: 18px; color: #0041d9; }
  #schoolOverlay .actions { display: flex; gap: 4px; }
  #schoolOverlay .actions button { background: none; border: 0; border-radius: 4px; padding: 6px 10px; font: inherit; font-weight: 600; color: #0041d9; cursor: pointer; }
  #schoolOverlay .actions button:hover { background: #eef3ff; }
  #schoolOverlay .collage { position: relative; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 420px; padding: 0 0 0; }
  #schoolOverlay .collage img { width: 100%; height: 100%; object-fit: cover; display: block; background: #ddd; }
  #schoolOverlay .collage img:first-child { grid-row: 1 / 3; }
  #schoolOverlay .seeAll { position: absolute; right: 12px; bottom: 12px; background: #fff; border: 1px solid #a7a6ab; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
  #schoolOverlay .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; }
  #schoolOverlay .gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #ddd; }
  #schoolOverlay .body { padding: 20px 24px 32px; max-width: 720px; }
  #schoolOverlay .headline { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  #schoolOverlay .facts { font-size: 18px; margin: 2px 0 6px; }
  #schoolOverlay .facts b { font-weight: 700; }
  #schoolOverlay .facts .sep { color: #a7a6ab; margin: 0 6px; }
  #schoolOverlay .addr { color: #2a2a33; }
  #schoolOverlay .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 18px 0 26px; }
  #schoolOverlay .chip { background: #f1f1f4; border-radius: 6px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  #schoolOverlay h2 { font-size: 22px; margin: 0 0 12px; }
  #schoolOverlay .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #schoolOverlay .tag { background: #e8f0fe; color: #1d2329; border-radius: 4px; padding: 3px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  #schoolOverlay .desc { line-height: 1.6; }
  #schoolOverlay .desc.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #schoolOverlay .more { background: none; border: 0; padding: 0; margin-top: 6px; color: #0041d9; font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 640px) {
    #schoolOverlay { padding: 0; }
    #schoolOverlay .sheet { border-radius: 0; }
    #schoolOverlay .collage { grid-template-columns: 1fr; grid-template-rows: 1fr; height: 260px; }
    #schoolOverlay .collage img:not(:first-child) { display: none; }
    #schoolOverlay .body { padding: 16px; }
  }

  #keygate { max-width: 420px; margin: 15vh auto; padding: 16px; }
  #keygate input { width: 100%; padding: 8px; margin: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
</div>

<script>
// ---------- synthetic Features (seeded, so every reload is the same) ----------
let seed = 42;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ORIGIN = { lat: 14.6507, lng: 121.0494 }; // Quezon City
const NAME_A = ['St. Mary\'s', 'Holy Cross', 'San Lorenzo', 'Our Lady of Fatima', 'Sacred Heart', 'Mabuhay', 'Bagong Pag-asa', 'Lourdes', 'Don Bosco', 'Maharlika', 'St. Joseph', 'Bright Minds'];
const NAME_B = ['Academy', 'School', 'Learning Center', 'Montessori', 'Christian School', 'College'];
const FEATURES = Array.from({ length: 60 }, (_, i) => ({
  id: 'S' + String(i + 1).padStart(3, '0'),
  name: `${NAME_A[i % NAME_A.length]} ${NAME_B[Math.floor(i / NAME_A.length) % NAME_B.length]}`,
  lat: ORIGIN.lat + (rand() - 0.5) * 0.14,
  lng: ORIGIN.lng + (rand() - 0.5) * 0.14,
}));
// Synthetic school details for D's tooltip + overlay. Own seed, so adding fields never moves the points above.
{
  let s2 = 7;
  const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(r2() * a.length)];
  const STREETS = ['Mabini St.', 'Kalayaan Ave.', 'Maginhawa St.', 'Tandang Sora Ave.', 'Visayas Ave.', 'Anonas St.', 'Kamias Rd.', 'Aurora Blvd.'];
  const BRGYS = ['Teachers Village', 'Project 4', 'Diliman', 'Cubao', 'Pinyahan', 'Bagong Silangan', 'Kamuning', 'Sikatuna Village'];
  FEATURES.forEach(f => Object.assign(f, {
    students: Math.round(50 * 200 ** (r2() ** 2)), // 50–10,000 skewed small: ~58% small, ~13% medium, ~9% large, ~20% mega
    grades: pick(['K–6', 'Grades 7–10', 'Grades 7–12', 'Grades 11–12', 'K–12']),
    type: r2() < 0.6 ? 'Public' : 'Private',
    founded: 1920 + Math.floor(r2() * 96),
    ratio: 20 + Math.floor(r2() * 26),
    address: `${1 + Math.floor(r2() * 300)} ${pick(STREETS)}, Brgy. ${pick(BRGYS)}, Quezon City`,
    photos: 12 + Math.floor(r2() * 29),
  }));
}

function distanceKm(a, b) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const ll = p => ({ lat: +p.lat().toFixed(5), lng: +p.lng().toFixed(5) });

// ---------- shared plumbing ----------
const params = new URLSearchParams(location.search);
const KEY = params.get('key');
let map, featureMarkers = [];

// Lucide icons (lucide-static 1.59.0), inner SVG only.
const ICONS = {
  landmark: '<path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/>',
  school: '<path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M18 4.933V21"/><path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6"/><path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11"/><path d="M6 4.933V21"/><circle cx="12" cy="9" r="2"/>',
  braces: '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
  radius: '<path d="M20.34 17.52a10 10 0 1 0-2.82 2.82"/><circle cx="19" cy="19" r="2"/><path d="m13.41 13.41 4.18 4.18"/><circle cx="12" cy="12" r="2"/>',
  mapPinPlus: '<path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><circle cx="12" cy="10" r="3"/><path d="M16 18h6"/><path d="M19 15v6"/>',
  search: '<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  minus: '<path d="M5 12h14"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
};
const svg = (inner, px = 18) => `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none">${inner}</svg>`;

// A menu that minimises to its icon. On narrow screens only one dock per column is open at a time.
const narrow = matchMedia('(max-width: 640px)');
function makeDock({ icon, title, body, open }) {
  const el = document.createElement('div');
  el.className = 'dock' + (open ? ' open' : '');
  el.innerHTML = `<button class="dockIcon" data-toggle title="${title}" aria-label="Show ${title}">${svg(ICONS[icon], 22)}</button>
    <div class="dockPanel"><div class="dockHead">${svg(ICONS[icon])}<b>${title}</b>
      <button class="dockMin" data-toggle title="Minimise" aria-label="Minimise ${title}">${svg(ICONS.minus)}</button></div>
      <div class="dockBody">${body}</div></div>`;
  el.addEventListener('click', e => { if (e.target.closest('[data-toggle]')) setDockOpen(el, !el.classList.contains('open')); });
  return el;
}
function setDockOpen(el, open) {
  if (open && narrow.matches) el.parentElement.querySelectorAll(':scope > .dock.open').forEach(d => d !== el && d.classList.remove('open'));
  el.classList.toggle('open', open);
}
const stateDock = makeDock({ icon: 'braces', title: 'State', body: '<pre id="state"></pre>', open: !narrow.matches });
stateDock.id = 'stateDock';
const cornerCol = document.createElement('div');
cornerCol.id = 'cornerCol';
cornerCol.appendChild(stateDock);
document.body.appendChild(cornerCol);

function showState(obj) { document.getElementById('state').textContent = JSON.stringify(obj, null, 2); }

const dot = (color, scale = 6) => ({ path: google.maps.SymbolPath.CIRCLE, scale, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1.5 });

function drawFeatures(onClick) {
  featureMarkers = FEATURES.map(f => {
    const m = new google.maps.Marker({ map, position: f, icon: dot('#888'), title: f.name });
    if (onClick) m.addListener('click', () => onClick(f));
    return m;
  });
}
function floatBox(html, style) {
  const el = document.createElement('div');
  el.className = 'float';
  Object.assign(el.style, style);
  el.innerHTML = html;
  document.body.appendChild(el);
  return el;
}

// ---------- Buffer Map: flexible buffer + band edges + school search ----------
// The buffer takes the colour of the band its radius has reached. The last band edge is the max radius (capped at 10 km).
// A new centre is placed only via the drop-pin button: drag the pin onto the map, or click it to toggle pin mode.
function BufferMap() {
  const PALETTE = ['#0b8043', '#f9ab00', '#e8710a', '#d93025', '#8430ce', '#1a73e8'];
  const MAX_KM = 10;
  const bands = [1, 2, 3];               // km band edges, ascending; last = max radius
  let circle = null, centredOn = null, guides = [], pinMode = false;
  const maxKm = () => bands.at(-1);
  const bandIndexFor = km => Math.max(0, bands.findIndex(edge => km <= edge + 1e-9));
  const colourOf = i => PALETTE[i % PALETTE.length];
  // Where a school sits relative to the buffer: distance from its centre and band index (-1 = outside); null with no buffer.
  function placement(f) {
    if (!circle) return null;
    const d = distanceKm(ll(circle.getCenter()), f);
    return { d, band: d <= circle.getRadius() / 1000 ? bandIndexFor(d) : -1 };
  }
  const dotColour = (f, p) => centredOn && f.id === centredOn.id ? '#000' : p.band >= 0 ? colourOf(p.band) : '#80868b';
  const dotHtml = colour => `<i class="dot" style="background:${colour}"></i>`;
  // Points around a geodesic circle of radiusKm (great-circle destination formula), for drawing band rings.
  function ringPath(c, radiusKm, n = 96) {
    const R = 6371, d = radiusKm / R, toRad = x => x * Math.PI / 180, toDeg = x => x * 180 / Math.PI;
    const lat1 = toRad(c.lat), lng1 = toRad(c.lng);
    return Array.from({ length: n }, (_, k) => {
      const brg = 2 * Math.PI * k / n;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brg));
      const lng2 = lng1 + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
      return { lat: toDeg(lat2), lng: toDeg(lng2) };
    });
  }

  drawFeatures(f => pinMode ? centreOn(f, true) : openOverlay(f));

  // ----- school-size markers: Lucide icon (lucide-static 1.59.0) in a badge filled with the band colour -----
  const SIZES = [
    { max: 300, label: 'Small', range: '< 300', icon: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' },
    { max: 700, label: 'Medium', range: '300–699', icon: '<path d="M12.35 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v2.35"/><path d="M14.8 12.4A1 1 0 0 0 14 12h-4a1 1 0 0 0-1 1v8"/><path d="M15 18h6"/><path d="M18 15v6"/>' },
    { max: 1500, label: 'Large', range: '700–1,499', icon: '<path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/>' },
    { max: Infinity, label: 'Mega', range: '1,500+', icon: '<path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/>' },
  ];
  const sizeOf = f => SIZES.find(s => f.students < s.max);
  const lucide = (size, px = 18) => svg(size.icon, px);
  const badgeUrl = (size, fill) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="${fill}" stroke="#fff" stroke-width="1.5"/>` +
    `<g transform="translate(6 6) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${size.icon}</g></svg>`);
  // Band-coloured badge inside the buffer; smaller grey badge outside it.
  function colourSchools(colourFor) {
    FEATURES.forEach((f, i) => {
      const fill = colourFor(f), px = fill ? 28 : 22;
      featureMarkers[i].setIcon({ url: badgeUrl(sizeOf(f), fill || '#80868b'), scaledSize: new google.maps.Size(px, px), anchor: new google.maps.Point(px / 2, px / 2) });
    });
  }

  // ----- hover tooltip: name + student count (replaces the native marker title) -----
  const tip = document.createElement('div');
  tip.id = 'schoolTip';
  document.body.appendChild(tip);
  FEATURES.forEach((f, i) => {
    const m = featureMarkers[i];
    m.setTitle(null);
    m.addListener('mouseover', e => {
      tip.innerHTML = `<b>${f.name}</b><br>${f.students.toLocaleString('en-US')} students · ${sizeOf(f).label}`;
      Object.assign(tip.style, { display: 'block', left: e.domEvent.clientX + 'px', top: e.domEvent.clientY + 'px' });
    });
    m.addListener('mouseout', () => { tip.style.display = 'none'; });
  });

  // ----- Zillow-style overlay: photo collage, sub-header facts, chips, "What's special" (lorem) -----
  const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.';
  const photo = (f, n, w = 800, h = 600) => `https://picsum.photos/seed/${f.id}-${n}/${w}/${h}`;
  function closeOverlay() {
    const el = document.getElementById('schoolOverlay');
    if (el) { el.remove(); update(); }
  }
  function openOverlay(f) {
    tip.style.display = 'none';
    closeOverlay();
    const c = circle && ll(circle.getCenter());
    const d = c && distanceKm(c, f);
    const inBuffer = c && d <= circle.getRadius() / 1000;
    const bi = inBuffer && bandIndexFor(d);
    const band = !c ? null : inBuffer ? `Band ${bi ? bands[bi - 1] : 0}–${bands[bi]} km` : 'Outside buffer';
    const chips = [['🏷️', `ID ${f.id}`], [lucide(sizeOf(f)), `${sizeOf(f).label} school`], ['🏫', f.type], ['📅', `Est. ${f.founded}`], ['👩‍🏫', `1:${f.ratio} student–teacher`], band && ['⭕', band]].filter(Boolean);
    const el = document.createElement('div');
    el.id = 'schoolOverlay';
    el.innerHTML = `<div class="sheet" role="dialog" aria-label="${f.name}">
      <div class="topbar"><span class="brand">Pinpoint</span>
        <div class="actions"><button>♡ Save</button><button>↗ Share</button><button data-close title="Close (Esc)">✕</button></div></div>
      <div class="collage">
        ${[0, 1, 2, 3, 4].map(n => `<img src="${photo(f, n, n ? 400 : 900, n ? 300 : 700)}" alt="">`).join('')}
        <button class="seeAll">▦ See all ${f.photos} photos</button>
      </div>
      <div class="gallery" hidden>${Array.from({ length: f.photos }, (_, n) => `<img loading="lazy" src="${photo(f, n, 440, 330)}" alt="">`).join('')}</div>
      <div class="body">
        <div class="headline">${f.students.toLocaleString('en-US')} students</div>
        <div class="facts"><b>${f.grades}</b><span class="sep">|</span><b>${f.type}</b>${c ? `<span class="sep">|</span><b>${d.toFixed(1)} km</b> away` : ''}</div>
        <div class="addr"><b>${f.name}</b> · ${f.address}</div>
        <div class="chips">${chips.map(([i, t]) => `<div class="chip"><span>${i}</span>${t}</div>`).join('')}</div>
        <h2>What's special</h2>
        <div class="tags">${['Lorem ipsum', 'Dolor sit', 'Amet consectetur', 'Adipiscing', 'Sed do eiusmod'].map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="desc clamped">${LOREM}<br><br>${LOREM}</div>
        <button class="more">Show more</button>
      </div></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => {
      if (e.target === el || e.target.closest('[data-close]')) return closeOverlay();
      if (e.target.closest('.seeAll')) {
        const g = el.querySelector('.gallery'), show = g.hidden;
        g.hidden = !show; el.querySelector('.collage').hidden = show;
        if (show) el.querySelector('.gallery').insertAdjacentHTML('beforebegin', '<button class="seeAll backToCollage" style="position:static;margin:8px 16px">← Back</button>');
      }
      if (e.target.closest('.backToCollage')) {
        el.querySelector('.gallery').hidden = true; el.querySelector('.collage').hidden = false; e.target.remove();
      }
      if (e.target.closest('.more')) {
        const clamped = el.querySelector('.desc').classList.toggle('clamped');
        e.target.textContent = clamped ? 'Show more' : 'Show less';
      }
    });
    showState({ overlay: { id: f.id, name: f.name, students: f.students, grades: f.grades, type: f.type,
      founded: f.founded, ratio: `1:${f.ratio}`, photos: f.photos, distanceKm: c ? +d.toFixed(3) : null, band } });
  }
  const onKey = e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('schoolOverlay')) closeOverlay(); else if (!insideList.hidden) toggleInsideList(false);
  };
  addEventListener('keydown', onKey);

  // ----- sticky header: one search field; focusing it opens the school list beneath, typing filters it -----
  const searchBar = floatBox(`
    <div class="searchField">${svg(ICONS.search)}
      <input id="q" placeholder="Search schools by name or ID" autocomplete="off" enterkeyhint="search"
        role="combobox" aria-expanded="false" aria-controls="results" aria-label="Search schools">
      <button id="qClear" title="Clear" aria-label="Clear search" hidden>${svg(ICONS.x)}</button>
    </div>
    <ul class="list" id="results" role="listbox" hidden></ul>`, {});
  searchBar.id = 'searchBar';

  // ----- right-hand column: Band edges and Landmarks docks -----
  const bandDock = makeDock({ icon: 'radius', title: 'Band edges', open: !narrow.matches, body: `
    <div id="centreName" style="font-weight:600"></div>
    <label style="display:flex;align-items:center;gap:8px;margin:6px 0">Radius <input id="r" type="range" min="100" step="50" style="flex:1;min-width:0"> <b id="rv"></b></label>
    <div style="margin:10px 0 4px;font-weight:600">Band edges</div>
    <div id="bandRows"></div>
    <button id="addBand">+ add band</button>
    <div class="hint" style="margin-top:8px">Drag the circle to move it, or its handles to resize.</div>` });
  // ----- counts pill + the list of schools inside it opens (each a link to the school's overlay) -----
  const pill = floatBox('', {});
  pill.id = 'countsPill';
  pill.setAttribute('role', 'button');
  pill.setAttribute('aria-expanded', 'false');
  pill.title = 'Show the schools inside';
  const insideList = floatBox('', {});
  insideList.id = 'insideList';
  insideList.setAttribute('role', 'dialog');
  insideList.setAttribute('aria-label', 'Schools inside the buffer');
  insideList.hidden = true;
  function toggleInsideList(open) {
    insideList.hidden = !open;
    pill.setAttribute('aria-expanded', open);
    update();
  }
  pill.addEventListener('click', () => { if (circle) toggleInsideList(insideList.hidden); });
  insideList.addEventListener('click', e => {
    if (e.target.closest('[data-close-list]')) return toggleInsideList(false);
    const a = e.target.closest('a[data-open]');
    if (a) { e.preventDefault(); openOverlay(FEATURES.find(f => f.id === a.dataset.open)); }
  });
  // Modal: a press anywhere else closes it (the school overlay it opens doesn't count).
  const onDown = e => { if (!insideList.hidden && !e.target.closest('#insideList, #countsPill, #schoolOverlay')) toggleInsideList(false); };
  addEventListener('pointerdown', onDown, true);
  function renderInsideList(c, km, bi, inside) {
    const rows = inside.map(f => ({ f, d: distanceKm(c, f) })).sort((a, b) => a.d - b.d);
    let prev = 0;
    insideList.innerHTML = `<div class="insideHead"><b>${inside.length} school${inside.length === 1 ? '' : 's'} inside</b>
        <button class="dockMin" data-close-list title="Close" aria-label="Close list">${svg(ICONS.x)}</button></div>` +
      bands.slice(0, bi + 1).map((edge, i) => {
        const inBand = rows.filter(r => bandIndexFor(r.d) === i);
        const html = `<div class="bandHead">${dotHtml(colourOf(i))}${prev}–${Math.min(edge, km).toFixed(2)} km <span class="hint">· ${inBand.length}</span></div>` +
          (inBand.length ? `<ul class="list">${inBand.map(({ f, d }) =>
            `<li><span class="name">${dotHtml(colourOf(i))}<a href="#" data-open="${f.id}">${f.name}</a></span><span class="hint">${d.toFixed(2)} km</span></li>`).join('')}</ul>`
            : '<div class="hint" style="padding:2px 14px 6px">None</div>');
        prev = edge; return html;
      }).join('');
  }
  const $ = s => document.querySelector(s);
  const q = $('#q'), results = $('#results'), qClear = $('#qClear');
  let typed = false; // false right after focus, so the full list shows until the Analyst types

  function renderResults() {
    const term = typed ? q.value.trim().toLowerCase() : '';
    const matching = FEATURES.filter(f => !term || f.name.toLowerCase().includes(term) || f.id.toLowerCase().includes(term))
      .sort((a, b) => a.name.localeCompare(b.name));
    results.innerHTML = matching.map(f =>
      (p => `<li data-id="${f.id}" role="option" class="${centredOn && f.id === centredOn.id ? 'sel' : ''}"><span class="name">${p ? dotHtml(dotColour(f, p)) : ''}${f.name}</span>` +
        `<span class="hint">${f.id}${p ? ` · ${p.d.toFixed(1)} km` : ''}</span></li>`)(placement(f))).join('')
      || '<li class="hint">No match.</li>';
  }
  function openResults(open) {
    results.hidden = !open;
    q.setAttribute('aria-expanded', open);
    if (open) renderResults();
  }
  // Outside the field, it shows the school the buffer is centred on.
  function syncQuery() {
    if (document.activeElement !== q) q.value = centredOn ? centredOn.name : '';
    qClear.hidden = !q.value;
  }
  function renderBandRows() {
    let prev = 0;
    $('#bandRows').innerHTML = bands.map((edge, i) => {
      const row = `<div class="band"><span class="swatch" style="background:${colourOf(i)}"></span>${prev} –
        <input data-i="${i}" type="number" step="0.1" min="0.1" value="${edge}" style="width:60px"> km
        ${bands.length > 1 ? `<button data-del="${i}" title="Remove band">✕</button>` : ''}</div>`;
      prev = edge; return row;
    }).join('');
  }
  function ensureCircle(at, radiusM) {
    if (circle) { circle.setCenter(at); return; }
    circle = new google.maps.Circle({ map, center: at, radius: radiusM, editable: true, draggable: true, strokeWeight: 2, fillOpacity: .12 });
    circle.addListener('radius_changed', () => {
      if (circle.getRadius() > maxKm() * 1000) return circle.setRadius(maxKm() * 1000); // clamp; re-fires
      update();
    });
    circle.addListener('dragend', () => { centredOn = null; update(); });
    circle.addListener('center_changed', update);
    circle.addListener('click', e => { if (pinMode) placeAt(e.latLng); }); // the circle swallows map clicks inside it
  }
  // Dropping the pin (on the map, or on a school in pin mode) always opens the buffer to the max radius: the outer band edge.
  function placeAt(latLng) {
    centredOn = null;
    ensureCircle(latLng, maxKm() * 1000);
    circle.setRadius(maxKm() * 1000);
    update();
  }
  function centreOn(f, fromPin = false) {
    centredOn = f;
    ensureCircle(f, fromPin ? maxKm() * 1000 : Math.min(+$('#r').value || 1000, maxKm() * 1000));
    if (fromPin) circle.setRadius(maxKm() * 1000);
    map.panTo(f);
    update();
  }

  function update() {
    guides.forEach(g => g.setMap(null)); guides = [];
    $('#r').max = maxKm() * 1000;
    syncQuery();
    if (!results.hidden) renderResults();
    if (!circle) {
      $('#rv').textContent = '–'; $('#centreName').textContent = 'No buffer placed yet.';
      pill.innerHTML = '<span class="hint">No buffer yet</span>';
      insideList.hidden = true; pill.setAttribute('aria-expanded', 'false');
      colourSchools(() => null);
      showState({ pinMode, centre: null, bandEdgesKm: [...bands] });
      return;
    }
    const c = ll(circle.getCenter()), km = circle.getRadius() / 1000, bi = bandIndexFor(km);
    // The editable circle is just the outline + handles; each band reached is filled as its own ring in its own colour.
    circle.setOptions({ fillOpacity: 0, strokeColor: colourOf(bi), strokeWeight: 3 });
    let inner = 0;
    bands.slice(0, bi + 1).forEach((edge, i) => {
      const outer = Math.min(edge, km);
      const paths = inner > 0 ? [ringPath(c, outer), ringPath(c, inner).reverse()] : [ringPath(c, outer)];
      guides.push(new google.maps.Polygon({ map, paths, clickable: false, fillColor: colourOf(i), fillOpacity: .22,
        strokeColor: colourOf(i), strokeOpacity: .9, strokeWeight: 1 }));
      // Max-range label on the ring's edge, at 45° (NE) to stay clear of the circle's N/E/S/W resize handles.
      guides.push(new google.maps.Marker({ map, position: ringPath(c, outer, 8)[1], clickable: false, zIndex: 1000,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 0 },
        label: { text: `${outer < edge ? 'max ' : ''}${edge} km`, color: '#1d2329', fontSize: '12px', fontWeight: '700' } }));
      inner = edge;
    });

    const perBand = bands.map(() => []);
    const inside = FEATURES.filter(f => (!centredOn || f.id !== centredOn.id) && distanceKm(c, f) <= km);
    inside.forEach(f => perBand[bandIndexFor(distanceKm(c, f))].push(f.id));
    const bandOfId = Object.fromEntries(perBand.flatMap((ids, i) => ids.map(id => [id, i])));
    colourSchools(f => centredOn && f.id === centredOn.id ? '#000' : f.id in bandOfId ? colourOf(bandOfId[f.id]) : null);

    $('#r').value = Math.round(circle.getRadius());
    $('#rv').textContent = `${km.toFixed(2)} km`;
    $('#centreName').innerHTML = centredOn ? `Centred on: ${centredOn.name} <span class="hint">${centredOn.id}</span>` : 'Centred on: placed point';
    let prev = 0;
    pill.innerHTML = `<span><b>${inside.length}</b><span class="wide"> Features</span> inside</span>` + bands.slice(0, bi + 1).map((edge, i) => {
      const chip = `<span class="bandCount" title="${prev}–${Math.min(edge, km).toFixed(2)} km: ${perBand[i].length}">${dotHtml(colourOf(i))}${perBand[i].length}</span>`;
      prev = edge; return chip;
    }).join('') + `<span class="chev">${svg(ICONS.chevronDown, 14)}</span>`;
    if (!insideList.hidden) renderInsideList(c, km, bi, inside);
    showState({ pinMode, centre: c, centredOn: centredOn && centredOn.id, radiusKm: +km.toFixed(3), maxKm: maxKm(),
      bandEdgesKm: [...bands], currentBand: bi + 1, insideCount: inside.length,
      perBand: bands.map((edge, i) => ({ toKm: edge, count: perBand[i].length, ids: perBand[i] })) });
  }

  // ----- floating drop-pin button: drag from it onto the map, or tap it to toggle pin mode; "?" opens help -----
  const verb = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click';
  const pinDock = floatBox(`
    <div id="pinPop" role="dialog" aria-label="How to drop a buffer centre" hidden>
      <div class="dockHead"><b>Drop a buffer centre</b><button class="dockMin" data-close-help title="Close" aria-label="Close help">${svg(ICONS.x)}</button></div>
      <ul>
        <li>${verb} the pin to turn pin mode on, then ${verb.toLowerCase()} the map (or a school) to put the centre there. ${verb} the pin again to stop.</li>
        <li>Or drag the pin straight onto the map.</li>
        <li>Then drag the circle to move it, or its handles to resize. Set the bands in ${svg(ICONS.radius, 14)} <b>Band edges</b>.</li>
      </ul>
    </div>
    <span class="pinChip">${verb} the map to set the centre</span>
    <button id="pinHelp" title="How does this work?" aria-label="How to drop a buffer centre">${svg(ICONS.help, 16)}</button>
    <button id="pinFab" title="Drop buffer centre (${verb.toLowerCase()}, or drag onto the map)" aria-label="Drop buffer centre" aria-pressed="false">${svg(ICONS.mapPinPlus, 26)}</button>`, {});
  pinDock.id = 'pinDock';
  const pinPop = pinDock.querySelector('#pinPop');
  pinDock.querySelector('#pinHelp').addEventListener('click', () => { pinPop.hidden = !pinPop.hidden; });
  pinDock.querySelector('[data-close-help]').addEventListener('click', () => { pinPop.hidden = true; });

  const mapEl = document.getElementById('map');
  const proj = new google.maps.OverlayView();       // only here to convert screen pixels to lat/lng
  proj.onAdd = proj.draw = proj.onRemove = () => {};
  proj.setMap(map);
  const ghost = document.createElement('div');
  ghost.textContent = '📍';
  Object.assign(ghost.style, { position: 'fixed', fontSize: '30px', transform: 'translate(-50%, -100%)', pointerEvents: 'none', zIndex: 20, display: 'none' });
  document.body.appendChild(ghost);
  const btn = pinDock.querySelector('#pinFab');

  function setPinMode(on) {
    pinMode = on;
    pinDock.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on);
    if (on) pinPop.hidden = true;
    map.setOptions({ draggableCursor: on ? 'crosshair' : null });
    update();
  }
  let press = null;
  btn.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, dragging: false }; btn.setPointerCapture(e.pointerId); e.preventDefault(); });
  btn.addEventListener('pointermove', e => {
    if (!press) return;
    if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) { press.dragging = true; ghost.style.display = 'block'; btn.style.cursor = 'grabbing'; pinPop.hidden = true; }
    if (press.dragging) Object.assign(ghost.style, { left: e.clientX + 'px', top: e.clientY + 'px' });
  });
  btn.addEventListener('pointerup', e => {
    if (!press) return;
    const wasDrag = press.dragging;
    press = null; ghost.style.display = 'none'; btn.style.cursor = 'grab';
    if (!wasDrag) return setPinMode(!pinMode);
    if (!mapEl.contains(document.elementFromPoint(e.clientX, e.clientY))) return; // dropped on a menu or off the map: cancel
    const r = mapEl.getBoundingClientRect();
    placeAt(proj.getProjection().fromContainerPixelToLatLng(new google.maps.Point(e.clientX - r.left, e.clientY - r.top)));
  });
  btn.addEventListener('pointercancel', () => { press = null; ghost.style.display = 'none'; });
  map.addListener('click', e => { if (pinMode) placeAt(e.latLng); });

  // ----- landmarks menu (minimisable) -----
  const shown = new Set(['poi.school', 'poi.park', 'poi.attraction']);
  const lm = makeDock({ icon: 'landmark', title: 'Landmarks', open: false, body:
    POI_CATEGORIES.map(([ft, label]) => `<label class="check"><input type="checkbox" data-ft="${ft}" ${shown.has(ft) ? 'checked' : ''}> ${label}</label>`).join('') });
  // ----- School size legend: bottom-right above State; starts open, greys out on the first activity elsewhere -----
  const legend = makeDock({ icon: 'school', title: 'School size', open: true, body: `
    <div class="legendGrid">${SIZES.map(s => `<span title="${s.label}: ${s.range} students"><img src="${badgeUrl(s, '#3c4043')}" width="18" height="18" alt=""> ${s.label} <span class="hint">${s.range}</span></span>`).join('')}</div>
    <div class="hint" style="margin-top:4px">Students · colour = band, grey = outside</div>` });
  legend.id = 'legendDock';
  cornerCol.prepend(legend);
  // Any press, key or wheel outside the legend greys it; pressing the legend itself restores full colour.
  ['pointerdown', 'keydown', 'wheel'].forEach(type => addEventListener(type, e => {
    legend.classList.toggle('faded', !(e.target instanceof Node && legend.contains(e.target)));
  }, { capture: true, passive: true }));
  // One right-hand column, so the menus stack instead of overlapping when any is expanded.
  floatBox('', {}).id = 'dockCol';
  $('#dockCol').append(bandDock, lm);
  lm.addEventListener('change', e => {
    const ft = e.target.dataset.ft;
    if (!ft) return;
    e.target.checked ? shown.add(ft) : shown.delete(ft);
    map.setOptions({ styles: poiStyles(shown) });
  });
  map.setOptions({ styles: poiStyles(shown) });

  q.addEventListener('focus', () => { typed = false; q.select(); openResults(true); });
  q.addEventListener('blur', () => { openResults(false); syncQuery(); });
  q.addEventListener('input', () => { typed = true; qClear.hidden = !q.value; renderResults(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape') q.blur();
    if (e.key === 'Enter') { const li = results.querySelector('li[data-id]'); if (li) { centreOn(FEATURES.find(f => f.id === li.dataset.id)); q.blur(); } }
  });
  // pointerdown would blur the field and close the list before the click lands
  [results, qClear].forEach(el => el.addEventListener('pointerdown', e => { if (document.activeElement === q) e.preventDefault(); }));
  results.addEventListener('click', e => { const li = e.target.closest('li[data-id]'); if (li) { centreOn(FEATURES.find(f => f.id === li.dataset.id)); q.blur(); } });
  qClear.addEventListener('click', () => { q.value = ''; q.focus(); typed = true; qClear.hidden = true; renderResults(); });
  $('#r').addEventListener('input', e => { if (circle) circle.setRadius(+e.target.value); });
  $('#bandRows').addEventListener('change', e => {
    if (e.target.dataset.i === undefined) return;
    bands[+e.target.dataset.i] = Math.min(MAX_KM, Math.max(0.1, +e.target.value));
    bands.sort((a, b) => a - b);
    renderBandRows();
    if (circle && circle.getRadius() > maxKm() * 1000) circle.setRadius(maxKm() * 1000); else update();
  });
  $('#bandRows').addEventListener('click', e => {
    if (e.target.dataset.del === undefined) return;
    bands.splice(+e.target.dataset.del, 1);
    renderBandRows();
    if (circle && circle.getRadius() > maxKm() * 1000) circle.setRadius(maxKm() * 1000); else update();
  });
  $('#addBand').addEventListener('click', () => {
    if (maxKm() >= MAX_KM) return alert(`The outer band edge is already at the ${MAX_KM} km maximum. Lower an edge first.`);
    bands.push(Math.min(MAX_KM, +(maxKm() + 1).toFixed(1))); renderBandRows(); update();
  });

  // The header and dock column take the top corners, so drop the map-type/fullscreen controls and move zoom off the pin button.
  map.setOptions({ mapTypeControl: false, fullscreenControl: false, zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER } });

  $('#r').max = maxKm() * 1000; $('#r').value = 1000;
  renderBandRows();
  update();
}

// Google's landmark categories (legacy JSON map styling). Each is all-or-nothing: malls can't be split from poi.business.
const POI_CATEGORIES = [
  ['poi.school', 'Schools & universities'],
  ['poi.park', 'Parks'],
  ['poi.attraction', 'Attractions (incl. museums)'],
  ['poi.business', 'Businesses (incl. malls, shops, food)'],
  ['poi.government', 'Government offices'],
  ['poi.medical', 'Hospitals & clinics'],
  ['poi.place_of_worship', 'Places of worship'],
  ['poi.sports_complex', 'Sports complexes'],
  ['transit.station.airport', 'Airports'],
  ['transit.station.bus', 'Bus stations'],
  ['transit.station.rail', 'Rail (MRT/LRT/PNR)'],
];
const DEFAULT_POIS = new Set(['poi.school', 'poi.park', 'poi.attraction']);
function poiStyles(shown) {
  return [
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit.station', stylers: [{ visibility: 'off' }] },
    ...[...shown].map(featureType => ({ featureType, stylers: [{ visibility: 'on' }] })),
  ];
}

window.initMap = () => {
  map = new google.maps.Map(document.getElementById('map'), { center: ORIGIN, zoom: 13, clickableIcons: false, streetViewControl: false, styles: poiStyles(DEFAULT_POIS) });
  BufferMap();
};

if (KEY) {
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(KEY)}&callback=initMap&v=weekly`;
  s.async = true;
  document.head.appendChild(s);
} else {
  cornerCol.style.display = 'none';
  document.getElementById('app').innerHTML = `<form id="keygate"><h3>Buffer Map prototype</h3>
    <p>Paste a Google Maps JavaScript API key. It goes into the URL only and is never stored.</p>
    <input name="key" placeholder="AIza..." autofocus><button>Load map</button></form>`;
}
</script>
