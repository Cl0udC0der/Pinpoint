<!doctype html>
<!--
  PROTOTYPE: throwaway. Lives on branch prototype/buffer-map, never on main.

  Question: what should designating a Buffer Map's centre look and feel like?
  Plan: structurally different variants on one page, switchable via ?variant=D|A|B|C
  and the floating bottom bar (or the ← / → keys).

    D  Hybrid (default)    A's flexible buffer + C's band edges + school search. Place via the drop-pin button
                           (drag it onto the map, or click it to toggle pin mode) or centre on a
                           school; the buffer takes the colour of the band its radius has reached; last edge = max radius (10 km cap).
                           Floating, minimisable Landmarks menu toggles each Google landmark category.
                           Hover a school for name + student count; click it (outside pin mode) for a Zillow-style
                           overlay: photo collage, student-count headline, fact chips, lorem "What's special".
                           School markers are Lucide size icons (house / house-plus / building / building-complex)
                           in band-coloured badges, with a floating School size legend
    A  Click to drop       full-bleed map; click anywhere to set the centre; drag the circle's handles to resize
    B  Pin + results list  side panel listing Features inside, sorted by Distance; draggable centre pin
    C  Feature as centre   pick a school as the centre; concentric distance bands with counts per band

  Features are SYNTHETIC (random points around Quezon City). The real Dataset isn't geocoded yet.
  Distance is straight-line (haversine), per CONTEXT.md.

  Run:  python -m http.server 8000 -d prototypes/buffer-map
  Open: http://localhost:8000/?key=YOUR_GOOGLE_MAPS_KEY&variant=A
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffer Map Prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: #1d2329; background: #fff; }
  #app { height: 100%; display: grid; grid-template-columns: 1fr; }
  #app.with-panel { grid-template-columns: 340px 1fr; }
  #panel { overflow: auto; border-right: 1px solid #ddd; padding: 12px; display: none; }
  #app.with-panel #panel { display: block; }
  #map { height: 100%; }

  .float { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); padding: 10px 12px; }
  .hint { color: #666; font-size: 12px; }
  .big { font-size: 28px; font-weight: 700; }
  ul.list { list-style: none; padding: 0; margin: 8px 0; }
  ul.list li { padding: 6px 4px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:hover { background: #f3f6fa; }
  ul.list li.sel { background: #e3edff; font-weight: 600; }
  .presets button { margin-right: 4px; }
  .band { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  #state { position: absolute; right: 10px; bottom: 70px; max-width: 320px; max-height: 40%; overflow: auto;
           background: #111; color: #9fe; font: 11px/1.35 ui-monospace, monospace; padding: 8px; border-radius: 6px; opacity: .9; white-space: pre; }
  #switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
              background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex; align-items: center; gap: 8px;
              box-shadow: 0 4px 14px rgba(0,0,0,.4); font-weight: 600; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; }
  #schoolTip { position: fixed; z-index: 15; pointer-events: none; background: #fff; border-radius: 6px; padding: 6px 10px;
               box-shadow: 0 2px 10px rgba(0,0,0,.3); transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; display: none; }

  /* Zillow-style school overlay (variant D) */
  #schoolOverlay { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px; }
  #schoolOverlay [hidden] { display: none !important; }
  #schoolOverlay .sheet { background: #fff; width: min(980px, 100%); max-height: 100%; overflow: auto; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.4); }
  #schoolOverlay .topbar { position: sticky; top: 0; z-index: 1; background: #fff; display: flex; justify-content: space-between; align-items: center;
                           padding: 10px 16px; border-bottom: 1px solid #e6e6e6; }
  #schoolOverlay .brand { font-weight: 800; font-size: 18px; color: #0041d9; }
  #schoolOverlay .actions { display: flex; gap: 4px; }
  #schoolOverlay .actions button { background: none; border: 0; border-radius: 4px; padding: 6px 10px; font: inherit; font-weight: 600; color: #0041d9; cursor: pointer; }
  #schoolOverlay .actions button:hover { background: #eef3ff; }
  #schoolOverlay .collage { position: relative; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 420px; padding: 0 0 0; }
  #schoolOverlay .collage img { width: 100%; height: 100%; object-fit: cover; display: block; background: #ddd; }
  #schoolOverlay .collage img:first-child { grid-row: 1 / 3; }
  #schoolOverlay .seeAll { position: absolute; right: 12px; bottom: 12px; background: #fff; border: 1px solid #a7a6ab; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
  #schoolOverlay .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; }
  #schoolOverlay .gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #ddd; }
  #schoolOverlay .body { padding: 20px 24px 32px; max-width: 720px; }
  #schoolOverlay .headline { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  #schoolOverlay .facts { font-size: 18px; margin: 2px 0 6px; }
  #schoolOverlay .facts b { font-weight: 700; }
  #schoolOverlay .facts .sep { color: #a7a6ab; margin: 0 6px; }
  #schoolOverlay .addr { color: #2a2a33; }
  #schoolOverlay .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 18px 0 26px; }
  #schoolOverlay .chip { background: #f1f1f4; border-radius: 6px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  #schoolOverlay h2 { font-size: 22px; margin: 0 0 12px; }
  #schoolOverlay .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #schoolOverlay .tag { background: #e8f0fe; color: #1d2329; border-radius: 4px; padding: 3px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  #schoolOverlay .desc { line-height: 1.6; }
  #schoolOverlay .desc.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #schoolOverlay .more { background: none; border: 0; padding: 0; margin-top: 6px; color: #0041d9; font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 640px) {
    #schoolOverlay { padding: 0; }
    #schoolOverlay .sheet { border-radius: 0; }
    #schoolOverlay .collage { grid-template-columns: 1fr; grid-template-rows: 1fr; height: 260px; }
    #schoolOverlay .collage img:not(:first-child) { display: none; }
    #schoolOverlay .body { padding: 16px; }
  }

  #keygate { max-width: 420px; margin: 15vh auto; padding: 16px; }
  #keygate input { width: 100%; padding: 8px; margin: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="map"></div>
</div>
<div id="state"></div>
<div id="switcher">
  <button id="prev" title="Previous variant (←)">‹</button>
  <span id="vlabel"></span>
  <button id="next" title="Next variant (→)">›</button>
</div>

<script>
// ---------- synthetic Features (seeded, so every reload is the same) ----------
let seed = 42;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ORIGIN = { lat: 14.6507, lng: 121.0494 }; // Quezon City
const NAME_A = ['St. Mary\'s', 'Holy Cross', 'San Lorenzo', 'Our Lady of Fatima', 'Sacred Heart', 'Mabuhay', 'Bagong Pag-asa', 'Lourdes', 'Don Bosco', 'Maharlika', 'St. Joseph', 'Bright Minds'];
const NAME_B = ['Academy', 'School', 'Learning Center', 'Montessori', 'Christian School', 'College'];
const FEATURES = Array.from({ length: 60 }, (_, i) => ({
  id: 'S' + String(i + 1).padStart(3, '0'),
  name: `${NAME_A[i % NAME_A.length]} ${NAME_B[Math.floor(i / NAME_A.length) % NAME_B.length]}`,
  lat: ORIGIN.lat + (rand() - 0.5) * 0.14,
  lng: ORIGIN.lng + (rand() - 0.5) * 0.14,
}));
// Synthetic school details for D's tooltip + overlay. Own seed, so adding fields never moves the points above.
{
  let s2 = 7;
  const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(r2() * a.length)];
  const STREETS = ['Mabini St.', 'Kalayaan Ave.', 'Maginhawa St.', 'Tandang Sora Ave.', 'Visayas Ave.', 'Anonas St.', 'Kamias Rd.', 'Aurora Blvd.'];
  const BRGYS = ['Teachers Village', 'Project 4', 'Diliman', 'Cubao', 'Pinyahan', 'Bagong Silangan', 'Kamuning', 'Sikatuna Village'];
  FEATURES.forEach(f => Object.assign(f, {
    students: Math.round(50 * 200 ** (r2() ** 2)), // 50–10,000 skewed small: ~58% small, ~13% medium, ~9% large, ~20% mega
    grades: pick(['K–6', 'Grades 7–10', 'Grades 7–12', 'Grades 11–12', 'K–12']),
    type: r2() < 0.6 ? 'Public' : 'Private',
    founded: 1920 + Math.floor(r2() * 96),
    ratio: 20 + Math.floor(r2() * 26),
    address: `${1 + Math.floor(r2() * 300)} ${pick(STREETS)}, Brgy. ${pick(BRGYS)}, Quezon City`,
    photos: 12 + Math.floor(r2() * 29),
  }));
}

function distanceKm(a, b) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const ll = p => ({ lat: +p.lat().toFixed(5), lng: +p.lng().toFixed(5) });

// ---------- shared plumbing ----------
const params = new URLSearchParams(location.search);
const KEY = params.get('key');
const VARIANTS = ['D', 'A', 'B', 'C'];
const NAMES = { A: 'Click to drop', B: 'Pin + results list', C: 'Feature as centre', D: 'Hybrid: flexible buffer + band edges' };
let map, featureMarkers = [], cleanup = () => {};

function showState(obj) { document.getElementById('state').textContent = JSON.stringify(obj, null, 2); }

const dot = (color, scale = 6) => ({ path: google.maps.SymbolPath.CIRCLE, scale, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1.5 });

function drawFeatures(onClick) {
  featureMarkers = FEATURES.map(f => {
    const m = new google.maps.Marker({ map, position: f, icon: dot('#888'), title: f.name });
    if (onClick) m.addListener('click', () => onClick(f));
    return m;
  });
}
function colourFeatures(colourFor) {
  FEATURES.forEach((f, i) => featureMarkers[i].setIcon(dot(colourFor(f) || '#bbb', colourFor(f) ? 7 : 5)));
}
function clearAll() {
  cleanup();
  featureMarkers.forEach(m => m.setMap(null));
  featureMarkers = [];
  document.getElementById('panel').innerHTML = '';
  document.querySelectorAll('.float').forEach(el => el.remove());
  document.getElementById('app').className = '';
}
function floatBox(html, style) {
  const el = document.createElement('div');
  el.className = 'float';
  Object.assign(el.style, style);
  el.innerHTML = html;
  document.body.appendChild(el);
  return el;
}

// ---------- Variant A: click to drop ----------
function VariantA() {
  let circle = null;
  drawFeatures();
  const box = floatBox(`
    <div class="hint">Click the map to set the centre. Drag the circle or its handles.</div>
    <label>Radius <input id="r" type="range" min="250" max="10000" step="250" value="2000"> <b id="rv">2.0 km</b></label>
    <div><span class="big" id="count">–</span> Features inside</div>`, { top: '10px', left: '10px' });
  const r = box.querySelector('#r');

  function update() {
    if (!circle) { colourFeatures(() => null); showState({ variant: 'A', centre: null, radiusM: +r.value }); return; }
    const c = ll(circle.getCenter()), km = circle.getRadius() / 1000;
    const inside = FEATURES.filter(f => distanceKm(c, f) <= km);
    const ids = new Set(inside.map(f => f.id));
    colourFeatures(f => ids.has(f.id) ? '#d93025' : null);
    box.querySelector('#count').textContent = inside.length;
    box.querySelector('#rv').textContent = km.toFixed(1) + ' km';
    r.value = Math.round(circle.getRadius());
    showState({ variant: 'A', centre: c, radiusM: Math.round(circle.getRadius()), insideCount: inside.length, insideIds: inside.map(f => f.id) });
  }
  const click = map.addListener('click', e => {
    if (circle) circle.setCenter(e.latLng);
    else {
      circle = new google.maps.Circle({ map, center: e.latLng, radius: +r.value, editable: true, draggable: true,
        fillColor: '#d93025', fillOpacity: .12, strokeColor: '#d93025', strokeWeight: 2 });
      circle.addListener('center_changed', update);
      circle.addListener('radius_changed', update);
    }
    update();
  });
  r.addEventListener('input', () => { box.querySelector('#rv').textContent = (r.value / 1000).toFixed(1) + ' km'; if (circle) circle.setRadius(+r.value); else update(); });
  update();
  return () => { click.remove(); circle && circle.setMap(null); };
}

// ---------- Variant B: draggable pin + ranked results list ----------
function VariantB() {
  document.getElementById('app').className = 'with-panel';
  let radiusKm = 2, selected = null;
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h3 style="margin:0 0 6px">Buffer Map</h3>
    <div class="hint">Drag the blue pin, or right-click the map to move it there.</div>
    <p><label>Centre <input id="lat" size="8"> <input id="lng" size="9"> <button id="go">Set</button></label></p>
    <p class="presets">Radius: ${[0.5, 1, 2, 3, 5].map(k => `<button data-k="${k}">${k} km</button>`).join('')}
       <input id="rk" type="number" step="0.1" min="0.1" style="width:60px"> km</p>
    <div><span class="big" id="count"></span> Features within <b id="rlabel"></b></div>
    <ul class="list" id="list"></ul>`;
  drawFeatures(f => { selected = f.id; update(); });
  const pin = new google.maps.Marker({ map, position: ORIGIN, draggable: true, zIndex: 999, title: 'Centre' });
  const circle = new google.maps.Circle({ map, center: ORIGIN, radius: radiusKm * 1000, clickable: false,
    fillColor: '#1a73e8', fillOpacity: .1, strokeColor: '#1a73e8', strokeWeight: 2 });

  function update() {
    const c = ll(pin.getPosition());
    circle.setCenter(c); circle.setRadius(radiusKm * 1000);
    const ranked = FEATURES.map(f => ({ ...f, d: distanceKm(c, f) })).filter(f => f.d <= radiusKm).sort((a, b) => a.d - b.d);
    const ids = new Set(ranked.map(f => f.id));
    colourFeatures(f => f.id === selected ? '#f9ab00' : ids.has(f.id) ? '#1a73e8' : null);
    panel.querySelector('#lat').value = c.lat; panel.querySelector('#lng').value = c.lng;
    panel.querySelector('#rk').value = radiusKm;
    panel.querySelector('#count').textContent = ranked.length;
    panel.querySelector('#rlabel').textContent = radiusKm + ' km';
    panel.querySelector('#list').innerHTML = ranked.map(f =>
      `<li data-id="${f.id}" class="${f.id === selected ? 'sel' : ''}"><span>${f.name}</span><span>${f.d.toFixed(2)} km</span></li>`).join('')
      || '<li class="hint">No Features inside.</li>';
    showState({ variant: 'B', centre: c, radiusKm, insideCount: ranked.length, selected,
      nearest: ranked.slice(0, 5).map(f => `${f.id} @ ${f.d.toFixed(2)} km`) });
  }
  panel.addEventListener('click', e => {
    if (e.target.dataset.k) { radiusKm = +e.target.dataset.k; update(); }
    const li = e.target.closest('li[data-id]');
    if (li) { selected = li.dataset.id; map.panTo(FEATURES.find(f => f.id === selected)); update(); }
    if (e.target.id === 'go') { pin.setPosition({ lat: +panel.querySelector('#lat').value, lng: +panel.querySelector('#lng').value }); map.panTo(pin.getPosition()); update(); }
  });
  panel.querySelector('#rk').addEventListener('change', e => { radiusKm = +e.target.value; update(); });
  pin.addListener('drag', update);
  const rc = map.addListener('rightclick', e => { pin.setPosition(e.latLng); update(); });
  update();
  return () => { pin.setMap(null); circle.setMap(null); rc.remove(); };
}

// ---------- Variant C: a Feature is the centre; concentric bands ----------
function VariantC() {
  const BANDS = [{ km: 1, c: '#0b8043' }, { km: 2, c: '#f9ab00' }, { km: 3, c: '#e8710a' }];
  let centre = null, rings = [];
  drawFeatures(f => { centre = f; update(); });
  const box = floatBox(`
    <div class="hint">Click a school to make it the centre.</div>
    <select id="pick"><option value="">— or choose a school —</option>${FEATURES.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}</select>
    <div id="centreName" style="margin:6px 0;font-weight:600"></div>
    <div id="bands"></div>
    <label class="hint">Band edges (km): <input id="edges" value="1,2,3" size="8"></label>`, { top: '10px', left: '10px', width: '260px' });

  function update() {
    rings.forEach(r => r.setMap(null)); rings = [];
    if (!centre) { colourFeatures(() => null); showState({ variant: 'C', centre: null }); return; }
    box.querySelector('#pick').value = centre.id;
    box.querySelector('#centreName').textContent = 'Centre: ' + centre.name;
    const counts = BANDS.map(() => []);
    const bandOf = f => BANDS.findIndex(b => distanceKm(centre, f) <= b.km);
    FEATURES.forEach(f => { if (f.id !== centre.id) { const i = bandOf(f); if (i >= 0) counts[i].push(f.id); } });
    [...BANDS].reverse().forEach(b => rings.push(new google.maps.Circle({ map, center: centre, radius: b.km * 1000, clickable: false,
      fillColor: b.c, fillOpacity: .08, strokeColor: b.c, strokeWeight: 2 })));
    colourFeatures(f => f.id === centre.id ? '#000' : (i => i >= 0 ? BANDS[i].c : null)(bandOf(f)));
    let prev = 0;
    box.querySelector('#bands').innerHTML = BANDS.map((b, i) => {
      const row = `<div class="band"><span class="swatch" style="background:${b.c}"></span>${prev}–${b.km} km: <b>${counts[i].length}</b></div>`;
      prev = b.km; return row;
    }).join('') + `<div class="hint">Total within ${BANDS.at(-1).km} km: ${counts.flat().length}</div>`;
    showState({ variant: 'C', centre: { id: centre.id, lat: +centre.lat.toFixed(5), lng: +centre.lng.toFixed(5) },
      bands: BANDS.map((b, i) => ({ toKm: b.km, count: counts[i].length, ids: counts[i] })) });
  }
  box.querySelector('#pick').addEventListener('change', e => { centre = FEATURES.find(f => f.id === e.target.value) || null; if (centre) map.panTo(centre); update(); });
  box.querySelector('#edges').addEventListener('change', e => {
    const kms = e.target.value.split(',').map(Number).filter(n => n > 0).sort((a, b) => a - b);
    const palette = ['#0b8043', '#f9ab00', '#e8710a', '#d93025', '#8430ce'];
    BANDS.splice(0, BANDS.length, ...kms.map((km, i) => ({ km, c: palette[i % palette.length] })));
    update();
  });
  update();
  return () => rings.forEach(r => r.setMap(null));
}

// ---------- Variant D: A's flexible buffer + C's band edges + school search ----------
// The buffer takes the colour of the band its radius has reached. The last band edge is the max radius (capped at 10 km).
// A new centre is placed only via the drop-pin button: drag the pin onto the map, or click it to toggle pin mode.
function VariantD() {
  const PALETTE = ['#0b8043', '#f9ab00', '#e8710a', '#d93025', '#8430ce', '#1a73e8'];
  const MAX_KM = 10;
  const bands = [1, 2, 3, 5, 10];        // km band edges, ascending; last = max radius
  let circle = null, centredOn = null, guides = [], pinMode = false;
  const maxKm = () => bands.at(-1);
  const bandIndexFor = km => Math.max(0, bands.findIndex(edge => km <= edge + 1e-9));
  const colourOf = i => PALETTE[i % PALETTE.length];
  // Points around a geodesic circle of radiusKm (great-circle destination formula), for drawing band rings.
  function ringPath(c, radiusKm, n = 96) {
    const R = 6371, d = radiusKm / R, toRad = x => x * Math.PI / 180, toDeg = x => x * 180 / Math.PI;
    const lat1 = toRad(c.lat), lng1 = toRad(c.lng);
    return Array.from({ length: n }, (_, k) => {
      const brg = 2 * Math.PI * k / n;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brg));
      const lng2 = lng1 + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
      return { lat: toDeg(lat2), lng: toDeg(lng2) };
    });
  }

  drawFeatures(f => pinMode ? centreOn(f) : openOverlay(f));

  // ----- school-size markers: Lucide icon (lucide-static 1.59.0) in a badge filled with the band colour -----
  const SIZES = [
    { max: 300, label: 'Small', range: '< 300', icon: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' },
    { max: 700, label: 'Medium', range: '300–699', icon: '<path d="M12.35 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v2.35"/><path d="M14.8 12.4A1 1 0 0 0 14 12h-4a1 1 0 0 0-1 1v8"/><path d="M15 18h6"/><path d="M18 15v6"/>' },
    { max: 1500, label: 'Large', range: '700–1,499', icon: '<path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/>' },
    { max: Infinity, label: 'Mega', range: '1,500+', icon: '<path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/>' },
  ];
  const sizeOf = f => SIZES.find(s => f.students < s.max);
  const lucide = (size, px = 18) => `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">${size.icon}</svg>`;
  const badgeUrl = (size, fill) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="${fill}" stroke="#fff" stroke-width="1.5"/>` +
    `<g transform="translate(6 6) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${size.icon}</g></svg>`);
  // Band-coloured badge inside the buffer; smaller grey badge outside it.
  function colourSchools(colourFor) {
    FEATURES.forEach((f, i) => {
      const fill = colourFor(f), px = fill ? 28 : 22;
      featureMarkers[i].setIcon({ url: badgeUrl(sizeOf(f), fill || '#80868b'), scaledSize: new google.maps.Size(px, px), anchor: new google.maps.Point(px / 2, px / 2) });
    });
  }

  // ----- hover tooltip: name + student count (replaces the native marker title) -----
  const tip = document.createElement('div');
  tip.id = 'schoolTip';
  document.body.appendChild(tip);
  FEATURES.forEach((f, i) => {
    const m = featureMarkers[i];
    m.setTitle(null);
    m.addListener('mouseover', e => {
      tip.innerHTML = `<b>${f.name}</b><br>${f.students.toLocaleString('en-US')} students · ${sizeOf(f).label}`;
      Object.assign(tip.style, { display: 'block', left: e.domEvent.clientX + 'px', top: e.domEvent.clientY + 'px' });
    });
    m.addListener('mouseout', () => { tip.style.display = 'none'; });
  });

  // ----- Zillow-style overlay: photo collage, sub-header facts, chips, "What's special" (lorem) -----
  const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.';
  const photo = (f, n, w = 800, h = 600) => `https://picsum.photos/seed/${f.id}-${n}/${w}/${h}`;
  function closeOverlay() {
    const el = document.getElementById('schoolOverlay');
    if (el) { el.remove(); update(); }
  }
  function openOverlay(f) {
    tip.style.display = 'none';
    closeOverlay();
    const c = circle && ll(circle.getCenter());
    const d = c && distanceKm(c, f);
    const inBuffer = c && d <= circle.getRadius() / 1000;
    const bi = inBuffer && bandIndexFor(d);
    const band = !c ? null : inBuffer ? `Band ${bi ? bands[bi - 1] : 0}–${bands[bi]} km` : 'Outside buffer';
    const chips = [['🏷️', `ID ${f.id}`], [lucide(sizeOf(f)), `${sizeOf(f).label} school`], ['🏫', f.type], ['📅', `Est. ${f.founded}`], ['👩‍🏫', `1:${f.ratio} student–teacher`], band && ['⭕', band]].filter(Boolean);
    const el = document.createElement('div');
    el.id = 'schoolOverlay';
    el.innerHTML = `<div class="sheet" role="dialog" aria-label="${f.name}">
      <div class="topbar"><span class="brand">Pinpoint</span>
        <div class="actions"><button>♡ Save</button><button>↗ Share</button><button data-close title="Close (Esc)">✕</button></div></div>
      <div class="collage">
        ${[0, 1, 2, 3, 4].map(n => `<img src="${photo(f, n, n ? 400 : 900, n ? 300 : 700)}" alt="">`).join('')}
        <button class="seeAll">▦ See all ${f.photos} photos</button>
      </div>
      <div class="gallery" hidden>${Array.from({ length: f.photos }, (_, n) => `<img loading="lazy" src="${photo(f, n, 440, 330)}" alt="">`).join('')}</div>
      <div class="body">
        <div class="headline">${f.students.toLocaleString('en-US')} students</div>
        <div class="facts"><b>${f.grades}</b><span class="sep">|</span><b>${f.type}</b>${c ? `<span class="sep">|</span><b>${d.toFixed(1)} km</b> away` : ''}</div>
        <div class="addr"><b>${f.name}</b> · ${f.address}</div>
        <div class="chips">${chips.map(([i, t]) => `<div class="chip"><span>${i}</span>${t}</div>`).join('')}</div>
        <h2>What's special</h2>
        <div class="tags">${['Lorem ipsum', 'Dolor sit', 'Amet consectetur', 'Adipiscing', 'Sed do eiusmod'].map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="desc clamped">${LOREM}<br><br>${LOREM}</div>
        <button class="more">Show more</button>
      </div></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => {
      if (e.target === el || e.target.closest('[data-close]')) return closeOverlay();
      if (e.target.closest('.seeAll')) {
        const g = el.querySelector('.gallery'), show = g.hidden;
        g.hidden = !show; el.querySelector('.collage').hidden = show;
        if (show) el.querySelector('.gallery').insertAdjacentHTML('beforebegin', '<button class="seeAll backToCollage" style="position:static;margin:8px 16px">← Back</button>');
      }
      if (e.target.closest('.backToCollage')) {
        el.querySelector('.gallery').hidden = true; el.querySelector('.collage').hidden = false; e.target.remove();
      }
      if (e.target.closest('.more')) {
        const clamped = el.querySelector('.desc').classList.toggle('clamped');
        e.target.textContent = clamped ? 'Show more' : 'Show less';
      }
    });
    showState({ variant: 'D', overlay: { id: f.id, name: f.name, students: f.students, grades: f.grades, type: f.type,
      founded: f.founded, ratio: `1:${f.ratio}`, photos: f.photos, distanceKm: c ? +d.toFixed(3) : null, band } });
  }
  const onKey = e => { if (e.key === 'Escape') closeOverlay(); };
  addEventListener('keydown', onKey);

  const box = floatBox(`
    <div class="hint">Drag the 📍 pin onto the map, or click it for pin mode (click it again to stop). Drag the circle to move it, or its handles to resize.</div>
    <button id="dropPin" style="margin:6px 0;padding:6px 10px;cursor:grab;touch-action:none;user-select:none">📍 Drop centre</button>
    <input id="q" placeholder="Search schools by name or ID…" style="width:100%;padding:6px;margin:6px 0 4px">
    <select id="pick" style="width:100%;padding:4px;margin-bottom:4px"></select>
    <ul class="list" id="results" style="max-height:160px;overflow:auto;margin:0"></ul>
    <div id="centreName" style="margin:6px 0;font-weight:600"></div>
    <label>Radius <input id="r" type="range" min="100" step="50" style="width:150px"> <b id="rv"></b></label>
    <div style="margin:8px 0 4px;font-weight:600">Band edges</div>
    <div id="bandRows"></div>
    <button id="addBand">+ add band</button>
    <div id="counts" style="margin-top:8px"></div>`, { top: '10px', left: '10px', width: '300px', maxHeight: 'calc(100% - 100px)', overflow: 'auto' });
  const $ = s => box.querySelector(s);

  function renderResults() {
    const q = $('#q').value.trim().toLowerCase();
    const matching = FEATURES.filter(f => !q || f.name.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
    const opts = `<option value="">— choose a school (${matching.length}) —</option>` +
      [...matching].sort((a, b) => a.name.localeCompare(b.name)).map(f => `<option value="${f.id}">${f.name} (${f.id})</option>`).join('');
    if ($('#pick').dataset.opts !== opts) { $('#pick').innerHTML = opts; $('#pick').dataset.opts = opts; }
    $('#pick').value = centredOn && matching.includes(centredOn) ? centredOn.id : '';
    const hits = q ? matching : [];
    $('#results').innerHTML = hits.slice(0, 30).map(f =>
      `<li data-id="${f.id}" class="${centredOn && f.id === centredOn.id ? 'sel' : ''}"><span>${f.name}</span><span class="hint">${f.id}</span></li>`).join('')
      || (q ? '<li class="hint">No match.</li>' : '');
  }
  function renderBandRows() {
    let prev = 0;
    $('#bandRows').innerHTML = bands.map((edge, i) => {
      const row = `<div class="band"><span class="swatch" style="background:${colourOf(i)}"></span>${prev} –
        <input data-i="${i}" type="number" step="0.1" min="0.1" value="${edge}" style="width:60px"> km
        ${bands.length > 1 ? `<button data-del="${i}" title="Remove band">✕</button>` : ''}</div>`;
      prev = edge; return row;
    }).join('');
  }
  function ensureCircle(at, radiusM) {
    if (circle) { circle.setCenter(at); return; }
    circle = new google.maps.Circle({ map, center: at, radius: radiusM, editable: true, draggable: true, strokeWeight: 2, fillOpacity: .12 });
    circle.addListener('radius_changed', () => {
      if (circle.getRadius() > maxKm() * 1000) return circle.setRadius(maxKm() * 1000); // clamp; re-fires
      update();
    });
    circle.addListener('dragend', () => { centredOn = null; update(); });
    circle.addListener('center_changed', update);
    circle.addListener('click', e => { if (pinMode) placeAt(e.latLng); }); // the circle swallows map clicks inside it
  }
  function placeAt(latLng) {
    centredOn = null;
    ensureCircle(latLng, Math.min(+$('#r').value || 1000, maxKm() * 1000));
    update();
  }
  function centreOn(f) {
    centredOn = f;
    ensureCircle(f, Math.min(+$('#r').value || 1000, maxKm() * 1000));
    map.panTo(f);
    update();
  }

  function update() {
    guides.forEach(g => g.setMap(null)); guides = [];
    $('#r').max = maxKm() * 1000;
    renderResults();
    if (!circle) {
      $('#rv').textContent = '–'; $('#centreName').textContent = 'No buffer placed yet.'; $('#counts').innerHTML = '';
      colourSchools(() => null);
      showState({ variant: 'D', pinMode, centre: null, bandEdgesKm: [...bands] });
      return;
    }
    const c = ll(circle.getCenter()), km = circle.getRadius() / 1000, bi = bandIndexFor(km);
    // The editable circle is just the outline + handles; each band reached is filled as its own ring in its own colour.
    circle.setOptions({ fillOpacity: 0, strokeColor: colourOf(bi), strokeWeight: 3 });
    let inner = 0;
    bands.slice(0, bi + 1).forEach((edge, i) => {
      const outer = Math.min(edge, km);
      const paths = inner > 0 ? [ringPath(c, outer), ringPath(c, inner).reverse()] : [ringPath(c, outer)];
      guides.push(new google.maps.Polygon({ map, paths, clickable: false, fillColor: colourOf(i), fillOpacity: .22,
        strokeColor: colourOf(i), strokeOpacity: .9, strokeWeight: 1 }));
      // Max-range label on the ring's edge, at 45° (NE) to stay clear of the circle's N/E/S/W resize handles.
      guides.push(new google.maps.Marker({ map, position: ringPath(c, outer, 8)[1], clickable: false, zIndex: 1000,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 0 },
        label: { text: `${outer < edge ? 'max ' : ''}${edge} km`, color: '#1d2329', fontSize: '12px', fontWeight: '700' } }));
      inner = edge;
    });

    const perBand = bands.map(() => []);
    const inside = FEATURES.filter(f => (!centredOn || f.id !== centredOn.id) && distanceKm(c, f) <= km);
    inside.forEach(f => perBand[bandIndexFor(distanceKm(c, f))].push(f.id));
    const bandOfId = Object.fromEntries(perBand.flatMap((ids, i) => ids.map(id => [id, i])));
    colourSchools(f => centredOn && f.id === centredOn.id ? '#000' : f.id in bandOfId ? colourOf(bandOfId[f.id]) : null);

    $('#r').value = Math.round(circle.getRadius());
    $('#rv').textContent = `${km.toFixed(2)} km`;
    $('#centreName').innerHTML = centredOn ? `Centred on: ${centredOn.name} <span class="hint">${centredOn.id}</span>` : 'Centred on: placed point';
    let prev = 0;
    $('#counts').innerHTML = `<div><span class="big">${inside.length}</span> Features inside</div>` + bands.slice(0, bi + 1).map((edge, i) => {
      const row = `<div class="band"><span class="swatch" style="background:${colourOf(i)}"></span>${prev}–${Math.min(edge, km).toFixed(2)} km: <b>${perBand[i].length}</b></div>`;
      prev = edge; return row;
    }).join('');
    showState({ variant: 'D', pinMode, centre: c, centredOn: centredOn && centredOn.id, radiusKm: +km.toFixed(3), maxKm: maxKm(),
      bandEdgesKm: [...bands], currentBand: bi + 1, insideCount: inside.length,
      perBand: bands.map((edge, i) => ({ toKm: edge, count: perBand[i].length, ids: perBand[i] })) });
  }

  // ----- drop-pin button: drag from it onto the map, or click it to toggle pin mode -----
  const mapEl = document.getElementById('map');
  const proj = new google.maps.OverlayView();       // only here to convert screen pixels to lat/lng
  proj.onAdd = proj.draw = proj.onRemove = () => {};
  proj.setMap(map);
  const ghost = document.createElement('div');
  ghost.textContent = '📍';
  Object.assign(ghost.style, { position: 'fixed', fontSize: '30px', transform: 'translate(-50%, -100%)', pointerEvents: 'none', zIndex: 20, display: 'none' });
  document.body.appendChild(ghost);
  const btn = $('#dropPin');

  function setPinMode(on) {
    pinMode = on;
    btn.textContent = on ? '📍 Pin mode ON (click to stop)' : '📍 Drop centre';
    btn.style.background = on ? '#1a73e8' : '';
    btn.style.color = on ? '#fff' : '';
    map.setOptions({ draggableCursor: on ? 'crosshair' : null });
    update();
  }
  let press = null;
  btn.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, dragging: false }; btn.setPointerCapture(e.pointerId); e.preventDefault(); });
  btn.addEventListener('pointermove', e => {
    if (!press) return;
    if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) { press.dragging = true; ghost.style.display = 'block'; btn.style.cursor = 'grabbing'; }
    if (press.dragging) Object.assign(ghost.style, { left: e.clientX + 'px', top: e.clientY + 'px' });
  });
  btn.addEventListener('pointerup', e => {
    if (!press) return;
    const wasDrag = press.dragging;
    press = null; ghost.style.display = 'none'; btn.style.cursor = 'grab';
    if (!wasDrag) return setPinMode(!pinMode);
    if (!mapEl.contains(document.elementFromPoint(e.clientX, e.clientY))) return; // dropped on a menu or off the map: cancel
    const r = mapEl.getBoundingClientRect();
    placeAt(proj.getProjection().fromContainerPixelToLatLng(new google.maps.Point(e.clientX - r.left, e.clientY - r.top)));
  });
  btn.addEventListener('pointercancel', () => { press = null; ghost.style.display = 'none'; });
  const click = map.addListener('click', e => { if (pinMode) placeAt(e.latLng); });

  // ----- landmarks menu (minimisable) -----
  const shown = new Set(['poi.school', 'poi.park', 'poi.attraction']);
  const lm = floatBox(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <b>Landmarks</b><button id="lmMin" title="Minimise">–</button>
    </div>
    <div id="lmBody" style="margin-top:6px">
      ${POI_CATEGORIES.map(([ft, label]) => `<label style="display:block"><input type="checkbox" data-ft="${ft}" ${shown.has(ft) ? 'checked' : ''}> ${label}</label>`).join('')}
    </div>`, { position: 'static' });
  const legend = floatBox(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <b>School size</b><button id="lgMin" title="Minimise">–</button>
    </div>
    <div id="lgBody" style="margin-top:6px">
      ${SIZES.map(s => `<div class="band"><img src="${badgeUrl(s, '#3c4043')}" width="22" height="22" alt=""> ${s.label} <span class="hint">${s.range} students</span></div>`).join('')}
      <div class="hint" style="margin-top:4px">Badge colour = buffer band; grey = outside.</div>
    </div>`, { position: 'static' });
  legend.querySelector('#lgMin').addEventListener('click', e => {
    const body = legend.querySelector('#lgBody'), hide = body.style.display !== 'none';
    body.style.display = hide ? 'none' : '';
    e.target.textContent = hide ? '+' : '–';
    e.target.title = hide ? 'Expand' : 'Minimise';
  });
  // One right-hand column, so the two menus stack instead of overlapping when either is expanded.
  floatBox('', { top: '60px', right: '10px', padding: '0', background: 'none', boxShadow: 'none',
    display: 'flex', flexDirection: 'column', alignItems: 'stretch', gap: '8px' }).append(lm, legend);
  lm.querySelector('#lmMin').addEventListener('click', e => {
    const body = lm.querySelector('#lmBody'), hide = body.style.display !== 'none';
    body.style.display = hide ? 'none' : '';
    e.target.textContent = hide ? '+' : '–';
    e.target.title = hide ? 'Expand' : 'Minimise';
  });
  lm.addEventListener('change', e => {
    const ft = e.target.dataset.ft;
    if (!ft) return;
    e.target.checked ? shown.add(ft) : shown.delete(ft);
    map.setOptions({ styles: poiStyles(shown) });
  });
  map.setOptions({ styles: poiStyles(shown) });

  $('#q').addEventListener('input', renderResults);
  $('#pick').addEventListener('change', e => { if (e.target.value) centreOn(FEATURES.find(f => f.id === e.target.value)); });
  $('#results').addEventListener('click', e => { const li = e.target.closest('li[data-id]'); if (li) centreOn(FEATURES.find(f => f.id === li.dataset.id)); });
  $('#r').addEventListener('input', e => { if (circle) circle.setRadius(+e.target.value); });
  $('#bandRows').addEventListener('change', e => {
    if (e.target.dataset.i === undefined) return;
    bands[+e.target.dataset.i] = Math.min(MAX_KM, Math.max(0.1, +e.target.value));
    bands.sort((a, b) => a - b);
    renderBandRows();
    if (circle && circle.getRadius() > maxKm() * 1000) circle.setRadius(maxKm() * 1000); else update();
  });
  $('#bandRows').addEventListener('click', e => {
    if (e.target.dataset.del === undefined) return;
    bands.splice(+e.target.dataset.del, 1);
    renderBandRows();
    if (circle && circle.getRadius() > maxKm() * 1000) circle.setRadius(maxKm() * 1000); else update();
  });
  $('#addBand').addEventListener('click', () => {
    if (maxKm() >= MAX_KM) return alert(`The outer band edge is already at the ${MAX_KM} km maximum. Lower an edge first.`);
    bands.push(Math.min(MAX_KM, +(maxKm() + 1).toFixed(1))); renderBandRows(); update();
  });

  $('#r').max = maxKm() * 1000; $('#r').value = 1000;
  renderBandRows();
  update();
  return () => {
    click.remove(); circle && circle.setMap(null); guides.forEach(g => g.setMap(null));
    proj.setMap(null); ghost.remove(); tip.remove();
    removeEventListener('keydown', onKey); document.getElementById('schoolOverlay')?.remove();
    map.setOptions({ styles: poiStyles(DEFAULT_POIS), draggableCursor: null });
  };
}

// ---------- switcher ----------
const RENDER = { A: VariantA, B: VariantB, C: VariantC, D: VariantD };
let current = VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'D';

function render(v) {
  clearAll();
  current = v;
  params.set('variant', v);
  history.replaceState(null, '', '?' + params);
  document.getElementById('vlabel').textContent = `${v} (${NAMES[v]})`;
  cleanup = RENDER[v]();
}
function cycle(step) { render(VARIANTS[(VARIANTS.indexOf(current) + step + VARIANTS.length) % VARIANTS.length]); }
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (document.getElementById('schoolOverlay')) return; // don't switch variants under an open overlay
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

// Google's landmark categories (legacy JSON map styling). Each is all-or-nothing: malls can't be split from poi.business.
const POI_CATEGORIES = [
  ['poi.school', 'Schools & universities'],
  ['poi.park', 'Parks'],
  ['poi.attraction', 'Attractions (incl. museums)'],
  ['poi.business', 'Businesses (incl. malls, shops, food)'],
  ['poi.government', 'Government offices'],
  ['poi.medical', 'Hospitals & clinics'],
  ['poi.place_of_worship', 'Places of worship'],
  ['poi.sports_complex', 'Sports complexes'],
  ['transit.station.airport', 'Airports'],
  ['transit.station.bus', 'Bus stations'],
  ['transit.station.rail', 'Rail (MRT/LRT/PNR)'],
];
const DEFAULT_POIS = new Set(['poi.school', 'poi.park', 'poi.attraction']);
function poiStyles(shown) {
  return [
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit.station', stylers: [{ visibility: 'off' }] },
    ...[...shown].map(featureType => ({ featureType, stylers: [{ visibility: 'on' }] })),
  ];
}

window.initMap = () => {
  map = new google.maps.Map(document.getElementById('map'), { center: ORIGIN, zoom: 13, clickableIcons: false, streetViewControl: false, styles: poiStyles(DEFAULT_POIS) });
  render(current);
};

if (KEY) {
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(KEY)}&callback=initMap&v=weekly`;
  s.async = true;
  document.head.appendChild(s);
} else {
  document.getElementById('switcher').style.display = 'none';
  document.getElementById('app').innerHTML = `<form id="keygate"><h3>Buffer Map prototype</h3>
    <p>Paste a Google Maps JavaScript API key. It goes into the URL only and is never stored.</p>
    <input name="key" placeholder="AIza..." autofocus><button>Load map</button></form>`;
}
</script>
</body>
</html>
